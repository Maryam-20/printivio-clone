{% extends "lightHeroNav.html" %}
{% block title %}Add Product{% endblock title %}
{% block page_content %}
{% load static %}
{% load crispy_forms_tags %}

<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5 border p-4 shadow-sm rounded bg-white">
            <h3 class="text-center mb-4">Product Form</h3>
            <form action="{% url 'add-products' %}" method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form|crispy }}
                <button class="btn btn-dark w-100 mt-3" type="submit">Create</button>
            </form>
        </div>
    </div>
</div>
{% endblock page_content %}
